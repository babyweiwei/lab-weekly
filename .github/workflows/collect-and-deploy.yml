name: 汇总学生汇报

# 每周一 09:00（北京时间）自动汇总；也可手动 Run workflow
# Pages 由 main 分支直接发布（Build and deployment → Deploy from a branch），
# 所以这里只负责「汇总 + 提交数据」，提交后页面自动刷新。
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: weekly-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 汇总学生仓库
        if: ${{ vars.ORG != '' || vars.ROSTER != '' }}
        env:
          ORG: ${{ vars.ORG }}
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          REPO_PREFIX: ${{ vars.REPO_PREFIX }}
          ROSTER: ${{ vars.ROSTER }}
          WEEKS: 24
        run: node scripts/collect.mjs

      - name: 提交数据变化
        run: |
          git config user.name "lab-weekly-bot"
          git config user.email "lab-weekly-bot@users.noreply.github.com"
          if [ -d data ]; then
            git add data
            if ! git diff --staged --quiet; then
              git commit -m "chore: 更新汇报汇总"
              git push
            else
              echo "汇总无变化"
            fi
          else
            echo "还没有 data 目录，跳过提交"
          fi

      - name: 写入运行摘要
        if: ${{ always() }}
        run: node scripts/summary-to-step.mjs
