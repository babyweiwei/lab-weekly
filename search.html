<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组会周报 · 检索</title>
<style>
  :root{--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--bg:#f6f8fa;--blue:#0969da;--mark:#fff8c5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Helvetica,Arial,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
  input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font:15px/1.4 inherit}
  input:focus{outline:2px solid #b6e3ff;outline-offset:1px}
  .hint{color:var(--muted);font-size:13px;margin:10px 0 0}
  #stat{margin:10px 0 18px;font-size:12.5px;color:var(--muted)}
  .hidden{display:none}
  .hit{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px}
  .hit-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
  .rank{color:var(--muted);min-width:16px}
  .tag{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:0 8px;font-size:12px}
  .file{color:var(--muted);font-size:12.5px}
  .hit-text{margin:8px 0 0;font-size:13.5px;line-height:1.75;color:#24292f}
  mark{background:var(--mark);padding:0 2px;border-radius:3px}
  .back{display:inline-block;margin-top:20px;color:var(--blue);text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>组会周报 · 检索</h1>
  <p class="sub">在所有周的 PPT 文本里搜关键词：谁讲过什么、哪个实验用过什么方法，都能定位到具体页。</p>

  <div class="box">
    <input id="q" placeholder="搜关键词，例如 梯度 / 分子 / baseline / 数据清洗" autocomplete="off" spellcheck="false">
    <p class="hint">中文按二元组匹配，英文按单词匹配；标题页命中会加权，多个词同时命中会提权。</p>
  </div>

  <div id="stat" class="hidden"></div>
  <div id="results"></div>

  <a class="back" href="./">← 回看板</a>
</div>
<script src="js/search.js"></script>
</body>
</html>
